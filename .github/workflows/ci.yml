name: test

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - releases/*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Run local form and Cypress tests
        run: |
          node cypress/test-server.js &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/health; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/health
          npm run test:e2e
